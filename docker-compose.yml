services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: c2
      MYSQL_USER: c2
      MYSQL_PASSWORD: c2_pass
      MYSQL_ROOT_PASSWORD: root_pass
    volumes:
      - db-data:/var/lib/mysql
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    working_dir: /app
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    ports:
      - "5000:5000"
      - "5001-5050:5001-5050"
    environment:
      FLASK_DEBUG: "1"
      DB_HOST: "db"
      DB_PORT: "3306"
      DB_NAME: "c2"
      DB_USER: "c2"
      DB_PASSWORD: "c2_pass"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - backend

volumes:
  db-data:
  frontend_node_modules:
